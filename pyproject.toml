[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-microstructure"
version = "0.1.1"
description = "自研市场微观结构库：限价订单簿、平方根/Kyle 冲击、Almgren-Chriss 最优执行、执行短缺与微观指标。"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zhuoming Wang" }]
keywords = ["quant", "market-microstructure", "order-book", "optimal-execution", "market-impact", "almgren-chriss"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.21"]

[project.urls]
Homepage = "https://github.com/Bruce848647703/kairos-microstructure"
Source = "https://github.com/Bruce848647703/kairos-microstructure"
Issues = "https://github.com/Bruce848647703/kairos-microstructure/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
plot = ["matplotlib>=3.5"]

[project.scripts]
kairos-microstructure = "kairos_microstructure.cli:main"

[tool.setuptools.packages.find]
include = ["kairos_microstructure*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"
